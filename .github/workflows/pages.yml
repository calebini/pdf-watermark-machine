name: Browser utility — GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Test and build browser utility
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

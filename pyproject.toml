[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-watermark"
version = "0.1.3"
description = "Customer-personalized PDF watermarks and qpdf permission controls"
requires-python = ">=3.13"
dependencies = ["pikepdf==10.17.0", "reportlab==5.0.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pypdf[crypto]==6.12.0", "pyinstaller==6.22.3"]

[project.scripts]
pdf-watermark = "pdf_watermark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
